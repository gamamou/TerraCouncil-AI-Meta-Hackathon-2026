name: Source syntax validation

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python source syntax without running paid APIs
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path('src').rglob('*.py')) + sorted(Path('demo').rglob('*.py'))
          if not files:
              raise SystemExit('No Python source files; source import incomplete')
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'Parsed {len(files)} Python files successfully')
          PY
